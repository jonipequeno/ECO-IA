<!DOCTYPE html>
<html lang="pt-BR" data-theme="escuro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rede Movili</title>
<script>
  /* Tema antes do primeiro quadro, para não piscar o escuro em quem escolheu o claro. */
  try {
    var temaSalvo = localStorage.getItem("movili-tema");
    if (temaSalvo === "claro" || temaSalvo === "escuro") document.documentElement.setAttribute("data-theme", temaSalvo);
  } catch (e) { /* navegação privada: fica o padrão */ }
</script>
<link rel="stylesheet" href="/rede-movili/tokens.css">
<link rel="stylesheet" href="/rede-movili/bundle.css">
<style>
  html, body { height: 100%; margin: 0; }
  #app { height: 100vh; height: 100dvh; }
  #carregando { display: grid; place-items: center; height: 100%; }
</style>
</head>
<body>
<div id="app"><p id="carregando" class="leitura" role="status">Carregando a rede…</p></div>
<script src="/rede-movili/bundle.js"></script>
<script>
"use strict";
(function () {
  /* Nomes de exibição das regiões. O Python não usa acento (convenção do
     repositório); a tela usa. A chave é o setor de movili/agentes/SETORES. */
  var NOMES_REGIOES = {
    socios: "Sócios", diretoria: "Diretoria", produto: "Produto", engenharia: "Engenharia",
    dados: "Dados", marketing: "Marketing", comercial: "Comercial", financeiro: "Financeiro",
    juridico: "Jurídico", seguranca: "Segurança", pessoas: "Pessoas",
    sucesso_do_cliente: "Sucesso do cliente"
  };
  /* Identifica esta aba: o estímulo de uma mensagem que ela mesma mandou volta
     marcado com este id e é ignorado, porque a ficha já acendeu a onda ao enviar. */
  var CLIENTE = Math.random().toString(36).slice(2, 12);
  var SALVAR_PESOS_MS = 60000;

  var app = document.getElementById("app");

  function obterJson(url) {
    return fetch(url, { headers: { "Accept": "application/json" } }).then(function (r) {
      if (!r.ok) throw new Error(url + " respondeu " + r.status);
      return r.json();
    });
  }

  function alternarTema() {
    var raiz = document.documentElement;
    var novo = raiz.getAttribute("data-theme") === "claro" ? "escuro" : "claro";
    raiz.setAttribute("data-theme", novo);
    try { localStorage.setItem("movili-tema", novo); } catch (e) { /* sem armazenamento: vale só nesta aba */ }
  }

  function enviarMensagem(texto, agente) {
    return fetch("/api/executar", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ tipo: "agente", agente: agente.id, texto: texto, cliente: CLIENTE })
    }).then(function (r) {
      if (!r.ok) {
        return r.json().catch(function () { return {}; }).then(function (d) {
          throw new Error(d.erro || "o painel respondeu " + r.status);
        });
      }
      return r.json();
    });
  }

  function montar(topologia, pesos) {
    (topologia.regioes || []).forEach(function (r) {
      if (NOMES_REGIOES[r.id]) r.nome = NOMES_REGIOES[r.id];
    });

    var tela = MoviliRede.Tela({
      demo: false,
      dados: topologia,
      pesos: pesos,
      conectado: false,
      aoEnviar: enviarMensagem,
      aoAlternarTema: alternarTema
    });
    app.textContent = "";
    app.appendChild(tela);
    var rede = tela.controle.rede;

    /* ---------- tráfego ao vivo ---------- */
    var fonte = new EventSource("/api/rede/eventos");
    fonte.onopen = function () { tela.controle.conexao(true); };
    fonte.onerror = function () { tela.controle.conexao(false); /* o EventSource reconecta sozinho */ };
    fonte.onmessage = function (m) {
      var ev;
      try { ev = JSON.parse(m.data); } catch (e) { return; }
      if (ev.acao === "registrar") rede.registrar(ev.dados);
      else if (ev.acao === "estimular" && ev.cliente !== CLIENTE) rede.estimular(ev.dados);
    };

    /* ---------- a rede que aprende entre sessões ---------- */
    function corpoPesos() { return JSON.stringify(rede.pesos()); }
    setInterval(function () {
      fetch("/api/rede/pesos", {
        method: "POST", headers: { "Content-Type": "application/json" }, body: corpoPesos()
      }).catch(function () { /* servidor fora: tenta de novo no próximo ciclo */ });
    }, SALVAR_PESOS_MS);
    window.addEventListener("pagehide", function () {
      if (navigator.sendBeacon) {
        navigator.sendBeacon("/api/rede/pesos", new Blob([corpoPesos()], { type: "application/json" }));
      }
    });
  }

  function iniciar() {
    Promise.all([
      obterJson("/api/rede/topologia"),
      obterJson("/api/rede/pesos").catch(function () { return {}; })
    ]).then(function (r) { montar(r[0], r[1]); }, function () {
      var aviso = document.getElementById("carregando");
      if (aviso) aviso.textContent = "Não foi possível falar com o painel. Tentando de novo…";
      setTimeout(iniciar, 3000);
    });
  }
  iniciar();
})();
</script>
</body>
</html>
